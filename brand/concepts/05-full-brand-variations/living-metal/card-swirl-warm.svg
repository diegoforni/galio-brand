<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Living Metal red-team card contours</title>
  <desc id="desc">A single-direction biomorphic contour with prominent photographic metal and crimson, bridged by Warm Ember and one gunmetal band.</desc>
  <defs>
    <clipPath id="metalClip4">
      <path d="M360 112c-18 1-29 12-23 25 9 20-8 32-28 24-25-9-39 3-30 21 9 19-7 31-32 32l-24 26h137z"/>
    </clipPath>
    <linearGradient id="shadeFill4" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4C"/>
      <stop offset="15%" stop-color="#5C5C5E"/>
      <stop offset="30%" stop-color="#68686A"/>
      <stop offset="45%" stop-color="#5A5A5C"/>
      <stop offset="60%" stop-color="#797A7C"/>
      <stop offset="72%" stop-color="#9C9DA0"/>
      <stop offset="83%" stop-color="#BFC0C3"/>
      <stop offset="92%" stop-color="#D6D7DA"/>
      <stop offset="100%" stop-color="#E4E5E8"/>
    </linearGradient>
    <linearGradient id="rimStroke4" x1="50%" y1="0%" x2="50%" y2="100%">
