    <path d="M360 112c-18 1-29 12-23 25 9 20-8 32-28 24-25-9-39 3-30 21 9 19-7 31-32 32l-24 26h137z" fill="none" stroke="url(#rimStroke4)" stroke-width="3" filter="url(#softBlur4)"/>
