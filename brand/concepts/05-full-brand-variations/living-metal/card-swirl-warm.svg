      <stop offset="55%" stop-color="#DADBDE" stop-opacity="0"/>
      <stop offset="78%" stop-color="#E8E9EC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F0F1F4" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="hot4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2F3F5" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#E4E5E8" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#E4E5E8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E4E5E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur4"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="depth" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-3" dy="5" stdDeviation="4" flood-color="#17191B" flood-opacity=".32"/>
    </filter>
